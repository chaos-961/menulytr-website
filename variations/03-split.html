<!DOCTYPE html>
<html lang="en" data-preset="rosso" data-root="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bottega · Lume</title>
<meta name="description" content="Sidebar menu with scroll-spy navigation for Osteria Lume.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/base.css">
<script src="../assets/palette.js"></script>
<style>
.shell { position: relative; z-index: 1; display: grid; grid-template-columns: 300px 1fr; min-height: 100dvh; }
.side { position: sticky; top: 0; height: 100dvh; display: flex; flex-direction: column; padding: 36px 32px 28px; border-right: 1px solid var(--line); background: var(--surface); }
.brand { font-family: var(--font-display); font-size: 44px; text-decoration: none; font-weight: 500; letter-spacing: -.03em; line-height: 1; }
.brand small { display: block; font-family: var(--font-mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-top: 10px; font-weight: 400; }
.catnav { margin-top: 44px; display: flex; flex-direction: column; gap: 2px; position: relative; }
.catnav a { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-radius: var(--radius); text-decoration: none; color: var(--muted); font-size: 15px; font-weight: 500; transition: color .25s; position: relative; z-index: 1; }
.catnav a .n { font-family: var(--font-mono); font-size: 11px; opacity: .7; }
.catnav a:hover { color: var(--text); }
.catnav a.on { color: var(--text); }
.catnav .marker { position: absolute; left: 0; width: 100%; height: 0; top: 0; background: var(--accent-soft); border-radius: var(--radius); transition: top .4s var(--ease), height .4s var(--ease); z-index: 0; border-left: 3px solid var(--accent); }
.side-foot { margin-top: auto; font-size: 13px; color: var(--muted); line-height: 1.6; }
.side-foot canvas { width: 100%; aspect-ratio: 1; display: block; margin: 0 auto 10px; max-height: 200px; }
.side-foot p { margin: 0; }
.content { padding: 40px clamp(20px, 4vw, 56px) 120px; min-width: 0; }
.cat { padding: 40px 0 28px; scroll-margin-top: 20px; }
.cat-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 22px; border-bottom: 1px solid var(--line); padding-bottom: 16px; }
.cat-head h2 { font-family: var(--font-display); font-size: clamp(36px, 5vw, 60px); font-weight: 500; margin: 0; letter-spacing: -.03em; line-height: 1; }
.cat-head .num { font-family: var(--font-mono); color: var(--accent); font-size: 12px; letter-spacing: .15em; display: block; margin-bottom: 12px; }
.cat-head p { margin: 0; color: var(--muted); max-width: 34ch; font-size: 14.5px; text-align: right; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 12px; }
.card { display: grid; grid-template-columns: 96px 1fr auto; gap: 16px; padding: 12px; border: 1px solid var(--line); border-radius: calc(var(--radius) + 4px); background: var(--surface); align-items: center; transition: transform .35s var(--ease), box-shadow .35s var(--ease), border-color .3s; }
.card:hover { transform: translateY(-2px); box-shadow: 0 18px 30px -20px rgb(0 0 0 / .4); border-color: color-mix(in oklab, var(--accent) 45%, var(--line)); }
.card figure { margin: 0; width: 96px; height: 96px; border-radius: var(--radius); overflow: hidden; }
.card img { width: 100%; height: 100%; object-fit: cover; transition: transform .8s var(--ease); }
.card:hover img { transform: scale(1.08); }
.card h3 { margin: 0 0 4px; font-family: var(--font-display); font-size: 18px; font-weight: 500; letter-spacing: -.01em; }
.card p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.4; }
.card .price { font-family: var(--font-mono); font-size: 15px; align-self: start; padding-top: 4px; }
.tags { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.tag { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 7px; }
.tag.pick { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 40%, transparent); }
.topbar, .chips { display: none; }
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .side { display: none; }
  .topbar { display: grid; grid-template-columns: 1fr 96px; align-items: center; gap: 12px; padding: 18px 20px 6px; position: relative; z-index: 1; }
  .topbar .brand { font-size: 36px; }
  .topbar canvas { width: 96px; height: 96px; display: block; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 10px 20px; position: sticky; top: 0; z-index: 5; background: color-mix(in oklab, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); scrollbar-width: none; border-bottom: 1px solid var(--line); }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); text-decoration: none; font-size: 13.5px; font-weight: 500; color: var(--muted); background: var(--surface); transition: .25s; }
  .chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .content { padding: 8px 16px 100px; }
  .cat { scroll-margin-top: 62px; padding-top: 28px; }
  .cat-head { flex-direction: column; align-items: flex-start; gap: 8px; }
  .cat-head p { text-align: left; }
  .card { grid-template-columns: 76px 1fr auto; gap: 12px; }
  .card figure { width: 76px; height: 76px; }
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <a class="brand" href="#top">Lume<small>Osteria · Pizzeria</small></a>
    <nav class="catnav" id="catnav" aria-label="Menu sections"><span class="marker" id="marker" aria-hidden="true"></span></nav>
    <div class="side-foot">
      <canvas id="bg" aria-hidden="true"></canvas>
      <p id="hours"></p>
      <p id="addr"></p>
    </div>
  </aside>
  <div>
    <div class="topbar"><a class="brand" href="#top">Lume<small>Osteria · Pizzeria</small></a><canvas id="bg-m" aria-hidden="true"></canvas></div>
    <nav class="chips" id="chips" aria-label="Menu sections"></nav>
    <main class="content" id="content"></main>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.158.0/three.min.js"></script>
<script src="../assets/menu.js"></script>
<script src="../assets/ui.js"></script>
<script src="../assets/scene.js"></script>
<script>
(function () {
  document.getElementById('hours').textContent = MENU.hours;
  document.getElementById('addr').textContent = MENU.address + ' · ' + MENU.phone;
  var catnav = document.getElementById('catnav'), chips = document.getElementById('chips'), content = document.getElementById('content'), marker = document.getElementById('marker');
  MENU.categories.forEach(function (c) {
    var a = document.createElement('a'); a.href = '#' + c.id; a.dataset.id = c.id; a.innerHTML = c.name + '<span class="n">' + c.items.length + '</span>'; catnav.appendChild(a);
    var ch = document.createElement('a'); ch.href = '#' + c.id; ch.dataset.id = c.id; ch.className = 'chip'; ch.textContent = c.name; chips.appendChild(ch);
    var s = document.createElement('section'); s.className = 'cat'; s.id = c.id;
    s.innerHTML = '<header class="cat-head rv"><div><span class="num">' + c.num + '</span><h2>' + c.name + '</h2></div><p>' + c.blurb + '</p></header><div class="cards">' +
      c.items.map(function (it, i) {
        return '<article class="card rv" style="--i:' + i + '"><figure>' + ML.img(it, 480, '96px') + '</figure><div><h3>' + ML.esc(it.name) + '</h3><p>' + ML.esc(it.desc) + '</p>' +
          (it.tags.length ? '<div class="tags">' + (ML.isPick(it) ? '<span class="tag pick">Pick</span>' : '') + ML.tags(it) + '</div>' : '') + '</div><span class="price">' + ML.price(it.price) + '</span></article>';
      }).join('') + '</div>';
    content.appendChild(s);
  });
  ML.reveal('.rv');
  var navLinks = [].slice.call(catnav.querySelectorAll('a')), chipEls = [].slice.call(chips.querySelectorAll('a'));
  function setMarker(el) { marker.style.top = el.offsetTop + 'px'; marker.style.height = el.offsetHeight + 'px'; }
  ML.spy([].slice.call(content.querySelectorAll('.cat')), function (id) {
    navLinks.forEach(function (a) { var on = a.dataset.id === id; a.classList.toggle('on', on); if (on) setMarker(a); });
    chipEls.forEach(function (a) { var on = a.dataset.id === id; a.classList.toggle('on', on); if (on) ML.scrollChipIntoView(chips, a); });
  }, 60);
  window.addEventListener('resize', function () { var on = catnav.querySelector('a.on'); if (on) setMarker(on); });
  /* Mount the rings on whichever canvas is visible at the current width. */
  var mq = window.matchMedia('(max-width: 900px)'), mounted = {};
  function ensureScene() { var id = mq.matches ? 'bg-m' : 'bg'; if (!mounted[id]) mounted[id] = true, MenuScene.mount(document.getElementById(id), 'rings'); }
  mq.addEventListener ? mq.addEventListener('change', ensureScene) : mq.addListener(ensureScene);
  ensureScene();
})();
</script>
</body>
</html>
