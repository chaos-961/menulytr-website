<!DOCTYPE html>
<html lang="en" data-preset="olive" data-root="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mosaico · Lume</title>
<meta name="description" content="Image-forward grid menu for Osteria Lume.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/base.css">
<script src="../assets/palette.js"></script>
<style>
.wrap { position: relative; z-index: 1; max-width: 1240px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px) 100px; }
.hero { display: grid; grid-template-columns: 1.1fr .9fr; min-height: 78vh; align-items: center; gap: 24px; padding-top: 64px; }
.hero-text .k { font-family: var(--font-mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); margin: 0 0 18px; }
.hero-text h1 { font-family: var(--font-display); font-size: clamp(56px, 9vw, 124px); font-weight: 500; line-height: .92; margin: 0 0 22px; letter-spacing: -.035em; }
.hero-text h1 em { font-style: italic; font-weight: 300; color: var(--accent); }
.hero-text p { font-size: clamp(16px, 1.6vw, 19px); color: var(--muted); max-width: 42ch; margin: 0 0 28px; }
.hero-meta { display: flex; gap: 8px 24px; font-family: var(--font-mono); font-size: 12px; letter-spacing: .04em; color: var(--muted); flex-wrap: wrap; }
.hero-canvas { width: 100%; aspect-ratio: 1; max-height: 68vh; display: block; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; min-height: 0; padding-top: 72px; gap: 0; } .hero-canvas { order: -1; max-height: 42vh; width: min(100%, 340px); margin: 0 auto; } }
.filters { position: sticky; top: 12px; z-index: 5; display: flex; justify-content: center; margin: 28px 0 36px; }
.filters-in { position: relative; display: flex; gap: 2px; padding: 4px; background: color-mix(in oklab, var(--surface) 84%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 999px; max-width: 100%; overflow-x: auto; scrollbar-width: none; box-shadow: 0 10px 30px -18px rgb(0 0 0 / .35); }
.filters-in::-webkit-scrollbar { display: none; }
.pill { position: absolute; top: 4px; left: 0; height: calc(100% - 8px); width: 0; background: var(--text); border-radius: 999px; transition: left .4s var(--ease), width .4s var(--ease); z-index: 0; }
.fbtn { position: relative; z-index: 1; border: 0; background: none; padding: 9px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--muted); cursor: pointer; white-space: nowrap; transition: color .3s; }
.fbtn.on { color: var(--bg); }
.fbtn:hover:not(.on) { color: var(--text); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 30px 20px; }
@media (max-width: 600px) { .grid { grid-template-columns: 1fr 1fr; gap: 22px 12px; } }
.card { display: flex; flex-direction: column; gap: 12px; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; opacity: 0; transform: translateY(16px) scale(.98); transition: opacity .5s var(--ease), transform .6s var(--ease); transition-delay: calc(var(--i) * 35ms); }
.card.in { opacity: 1; transform: none; }
.card.hide { display: none; }
.card figure { margin: 0; border-radius: var(--radius); overflow: hidden; aspect-ratio: 4 / 5; background: var(--surface); position: relative; }
.card img { width: 100%; height: 100%; object-fit: cover; transition: transform .9s var(--ease); }
.card:hover img { transform: scale(1.06); }
.card .chip { position: absolute; left: 10px; top: 10px; background: var(--surface); color: var(--text); font-family: var(--font-mono); font-size: 12px; padding: 5px 9px; border-radius: 999px; box-shadow: 0 2px 8px rgb(0 0 0 / .12); }
.card .cat-chip { position: absolute; right: 10px; bottom: 10px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-ink); background: var(--accent); padding: 5px 9px; border-radius: 999px; opacity: 0; transform: translateY(6px); transition: .35s var(--ease); }
.card:hover .cat-chip { opacity: 1; transform: none; }
.card h3 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 18px; letter-spacing: -.01em; }
.card p { margin: 4px 0 0; font-size: 13.5px; color: var(--muted); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tags { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.tag { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 7px; }
.tag.pick { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 40%, transparent); }
dialog.detail { border: 0; padding: 0; background: transparent; max-width: min(920px, calc(100vw - 32px)); width: 100%; margin: auto; }
dialog.detail::backdrop { background: rgb(0 0 0 / .5); backdrop-filter: blur(6px); }
dialog[open] { animation: pop .4s var(--ease); }
@keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.98); } }
.detail-in { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); color: var(--text); border-radius: calc(var(--radius) + 6px); overflow: hidden; }
.detail-in img { width: 100%; height: 100%; object-fit: cover; aspect-ratio: 4 / 5; }
.detail-body { padding: clamp(24px, 4vw, 44px); display: flex; flex-direction: column; gap: 14px; position: relative; }
.detail-body .k { font-family: var(--font-mono); font-size: 12px; color: var(--accent); letter-spacing: .12em; text-transform: uppercase; }
.detail-body h2 { font-family: var(--font-display); font-size: clamp(28px, 4vw, 42px); margin: 0; font-weight: 500; letter-spacing: -.02em; line-height: 1.05; padding-right: 36px; }
.detail-body p { margin: 0; color: var(--muted); font-size: 16px; }
.detail-body .p { font-family: var(--font-mono); font-size: 22px; margin-top: auto; color: var(--text); }
.close { position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 18px; line-height: 1; display: grid; place-items: center; padding: 0; transition: .2s; }
.close:hover { border-color: var(--accent); color: var(--accent); }
@media (max-width: 700px) { .detail-in { grid-template-columns: 1fr; } .detail-in img { aspect-ratio: 16 / 10; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="hero-text">
      <p class="k rv" style="--i:0">Osteria · Pizzeria · Trastevere</p>
      <h1 class="rv" style="--i:1">Lume, <em>every plate</em> on the table.</h1>
      <p class="rv" style="--i:2" id="lede"></p>
      <div class="hero-meta rv" style="--i:3" id="meta"></div>
    </div>
    <canvas id="bg" class="hero-canvas" aria-hidden="true"></canvas>
  </header>
  <nav class="filters" aria-label="Filter by category"><div class="filters-in" id="filters"><span class="pill" id="pill" aria-hidden="true"></span></div></nav>
  <main class="grid" id="grid"></main>
</div>
<dialog class="detail" id="detail" aria-label="Dish details">
  <div class="detail-in">
    <img id="d-img" alt="">
    <div class="detail-body">
      <button class="close" type="button" id="d-close" aria-label="Close">&times;</button>
      <span class="k" id="d-cat"></span>
      <h2 id="d-name"></h2>
      <p id="d-desc"></p>
      <div class="tags" id="d-tags"></div>
      <div class="p" id="d-price"></div>
    </div>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.158.0/three.min.js"></script>
<script src="../assets/menu.js"></script>
<script src="../assets/ui.js"></script>
<script src="../assets/scene.js"></script>
<script>
(function () {
  document.getElementById('lede').textContent = MENU.tagline;
  document.getElementById('meta').innerHTML = '<span>' + MENU.hours + '</span><span>' + MENU.address + '</span>';
  var filters = document.getElementById('filters'), pill = document.getElementById('pill'), grid = document.getElementById('grid');
  var all = [];
  MENU.categories.forEach(function (c) { c.items.forEach(function (it) { all.push({ c: c, it: it }); }); });

  function fbtn(id, label) { var b = document.createElement('button'); b.className = 'fbtn'; b.type = 'button'; b.dataset.cat = id; b.textContent = label; filters.appendChild(b); return b; }
  fbtn('all', 'Everything').classList.add('on');
  MENU.categories.forEach(function (c) { fbtn(c.id, c.name); });

  grid.innerHTML = all.map(function (e, i) {
    var it = e.it;
    return '<button class="card" type="button" data-cat="' + e.c.id + '" data-i="' + i + '" style="--i:' + (i % 8) + '">' +
      '<figure>' + ML.img(it, 800, '(max-width: 600px) 50vw, (max-width: 1240px) 25vw, 300px') + '<span class="chip">' + ML.price(it.price) + '</span><span class="cat-chip">' + e.c.name + '</span></figure>' +
      '<div><h3>' + ML.esc(it.name) + '</h3><p>' + ML.esc(it.desc) + '</p>' +
      (it.tags.length ? '<div class="tags">' + (ML.isPick(it) ? '<span class="tag pick">Pick</span>' : '') + ML.tags(it) + '</div>' : '') + '</div></button>';
  }).join('');
  var cards = [].slice.call(grid.querySelectorAll('.card'));
  ML.reveal('.rv'); ML.reveal('.card');

  function setPill(b) { pill.style.left = b.offsetLeft + 'px'; pill.style.width = b.offsetWidth + 'px'; }
  setPill(filters.querySelector('.fbtn'));
  window.addEventListener('resize', function () { setPill(filters.querySelector('.fbtn.on')); });

  filters.addEventListener('click', function (e) {
    var b = e.target.closest('.fbtn'); if (!b) return;
    filters.querySelectorAll('.fbtn').forEach(function (x) { x.classList.toggle('on', x === b); });
    setPill(b); ML.scrollChipIntoView(filters, b);
    var cat = b.dataset.cat, n = 0;
    cards.forEach(function (c) { c.classList.remove('in'); });
    void grid.offsetWidth;
    cards.forEach(function (c) { var show = cat === 'all' || c.dataset.cat === cat; c.classList.toggle('hide', !show); if (show) c.style.setProperty('--i', (n++) % 10); });
    requestAnimationFrame(function () { requestAnimationFrame(function () { cards.forEach(function (c) { if (!c.classList.contains('hide')) c.classList.add('in'); }); }); });
    var top = filters.getBoundingClientRect().top;
    if (top < 0) window.scrollTo({ top: window.scrollY + top - 12, behavior: 'smooth' });
  });

  var dlg = document.getElementById('detail');
  grid.addEventListener('click', function (e) {
    var c = e.target.closest('.card'); if (!c) return;
    var d = all[+c.dataset.i], it = d.it;
    var img = document.getElementById('d-img'); img.src = MENU.img(it.img, 900); img.alt = it.name;
    document.getElementById('d-cat').textContent = d.c.name;
    document.getElementById('d-name').textContent = it.name;
    document.getElementById('d-desc').textContent = it.desc;
    document.getElementById('d-tags').innerHTML = (ML.isPick(it) ? '<span class="tag pick">Chef’s pick</span>' : '') + ML.tags(it);
    document.getElementById('d-price').textContent = ML.price(it.price);
    dlg.showModal();
  });
  document.getElementById('d-close').addEventListener('click', function () { dlg.close(); });
  dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });

  MenuScene.mount(document.getElementById('bg'), 'blob');
})();
</script>
</body>
</html>
